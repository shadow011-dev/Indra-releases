name: Indra
options:
  bundleIdPrefix: com.indra
  deploymentTarget:
    macOS: "15.0"
targets:
  Indra:
    type: application
    platform: macOS
    sources: [Indra]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indra.Indra
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Indra/Indra.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
